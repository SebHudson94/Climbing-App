<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<!-- Leave content empty when the server serves this page. When hosting the front end elsewhere (e.g. GitHub Pages), set it to your server URL. -->
<meta name="api-base" content="">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Route Analyser</title>
<style>
:root{--bg:#f7f7f5;--fg:#1c1c1e;--card:#ffffff;--muted:#6b6b70;--accent:#2563eb;--border:#d9d9de;--err:#dc2626}
@media (prefers-color-scheme: dark){
  :root{--bg:#121214;--fg:#f2f2f4;--card:#1d1d21;--muted:#9a9aa2;--accent:#60a5fa;--border:#2e2e35;--err:#f87171}
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);
  padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));line-height:1.5;max-width:720px;margin-inline:auto}
h1{font-size:1.4rem;margin:0 0 12px}
h2{font-size:1rem;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
button{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 16px;
  width:100%;font-weight:600;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
.hint{width:100%;padding:10px 12px;margin-bottom:10px;border-radius:10px;border:1px solid var(--border);
  background:var(--card);color:var(--fg);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{width:auto;padding:8px 14px;background:var(--card);color:var(--fg);border:2px solid var(--border)}
.chip.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
canvas{width:100%;height:auto;border-radius:10px;display:none;margin-top:10px}
.status{color:var(--muted);font-size:.9rem;margin-top:10px}
.error{color:var(--err);font-size:.9rem;margin-top:10px}
.guide h3{margin:14px 0 4px;font-size:.95rem}
.guide p{margin:0 0 4px}
.guide ol,.guide ul{margin:0;padding-left:20px}
.guide li{margin-bottom:4px}
.badge{display:inline-block;font-size:.8rem;padding:2px 8px;border-radius:999px;border:1px solid var(--border);color:var(--muted);margin-left:6px}
.hidden{display:none}
.filebtn{display:block;text-align:center;background:var(--accent);color:#fff;border-radius:10px;padding:12px 16px;font-weight:600;cursor:pointer}
.fileinput{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<h1>Route Analyser</h1>

<div class="card">
  <h2>1. Photo of the wall</h2>
  <label class="filebtn" for="file">Take or choose a photo</label>
  <input type="file" id="file" accept="image/*" class="fileinput">
  <canvas id="canvas"></canvas>
</div>

<div class="card">
  <h2>2. Scan the holds</h2>
  <input type="text" id="hint" class="hint" placeholder="Colour to find, e.g. purple (optional)">
  <button id="scanBtn" disabled>Scan route colours</button>
  <div id="chips" class="chips"></div>
  <div id="scanStatus" class="status"></div>
</div>

<div class="card">
  <h2>3. Approach guide</h2>
  <button id="analyseBtn" disabled>Analyse selected route</button>
  <div id="guide" class="guide"></div>
  <div id="status" class="status"></div>
  <div id="error" class="error hidden"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const API_BASE = ((document.querySelector('meta[name="api-base"]') || {}).content || '').replace(/\/$/, '');
const canvas = $('canvas'), ctx = canvas.getContext('2d');
const COLOUR_HEX = {red:'#ef4444',blue:'#3b82f6',green:'#22c55e',yellow:'#eab308',orange:'#f97316',
  purple:'#a855f7',pink:'#ec4899',black:'#111111',white:'#f5f5f5',grey:'#9ca3af',gray:'#9ca3af',
  brown:'#92400e',teal:'#14b8a6'};

let baseImg = null;      // HTMLImageElement of the downscaled photo
let imageB64 = null;     // base64 JPEG without data-URL prefix
let routes = [];         // [{colour, holds:[{x,y,start}]}]
let chosen = null;       // index into routes

function setError(msg){ const e=$('error'); e.textContent=msg||''; e.classList.toggle('hidden',!msg); }
function setStatus(id,msg){ $(id).textContent = msg||''; }

// ---- Photo handling: downscale to keep the API payload small ----
$('file').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 1024, scale = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
      const off = document.createElement('canvas'); off.width=w; off.height=h;
      off.getContext('2d').drawImage(img,0,0,w,h);
      const url = off.toDataURL('image/jpeg', 0.85);
      imageB64 = url.split(',')[1];
      baseImg = new Image();
      baseImg.onload = () => { routes=[]; chosen=null; renderAll(); };
      baseImg.src = url;
      $('scanBtn').disabled = false;
      setError(''); setStatus('scanStatus','');
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(f);
};

// ---- Drawing: photo plus hold overlay for the chosen route ----
function draw(){
  if(!baseImg){ canvas.style.display='none'; return; }
  canvas.style.display='block';
  canvas.width = baseImg.naturalWidth; canvas.height = baseImg.naturalHeight;
  ctx.drawImage(baseImg,0,0);
  if(chosen===null || !routes[chosen]) return;
  const r = routes[chosen], col = COLOUR_HEX[(r.colour||'').toLowerCase()] || '#00ff88';
  const rad = canvas.width * 0.022;
  ctx.lineWidth = Math.max(3, canvas.width*0.006);
  ctx.strokeStyle = col;
  for(const h of r.holds){
    const x = h.x*canvas.width, y = h.y*canvas.height;
    ctx.beginPath(); ctx.arc(x,y,rad,0,Math.PI*2); ctx.stroke();
    if(h.start){ ctx.beginPath(); ctx.arc(x,y,rad*1.6,0,Math.PI*2); ctx.stroke(); }
  }
}

// ---- Colour chips ----
function renderChips(){
  const box = $('chips'); box.innerHTML='';
  routes.forEach((r,i)=>{
    const b = document.createElement('button');
    b.className = 'chip' + (i===chosen?' sel':'');
    b.textContent = `${r.colour} (${r.holds.length} holds)`;
    b.onclick = () => { chosen=i; renderAll(); };
    box.appendChild(b);
  });
  $('analyseBtn').disabled = chosen===null;
}
function renderAll(){ renderChips(); draw(); }

// ---- Model API (via server proxy) ----
async function ask(content){
  const res = await fetch(API_BASE + '/api/messages', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({max_tokens:1000, messages:[{role:'user',content}]})
  });
  if(!res.ok) throw new Error('Request failed (' + res.status + ')');
  const data = await res.json();
  return data.content.map(b => b.text || '').join('');
}
function parseJSON(text){
  const clean = text.replace(/```json|```/g,'');
  const s = clean.indexOf('{'), e = clean.lastIndexOf('}');
  if(s<0 || e<0) throw new Error('No JSON in response');
  const body = clean.slice(s,e+1);
  try { return JSON.parse(body); }
  catch(_) {
    // Repair common model slips: trailing commas, and missing commas between objects
    const repaired = body.replace(/,\s*([}\]])/g,'$1').replace(/}\s*{/g,'},{');
    return JSON.parse(repaired);
  }
}
// Ask for JSON, retrying up to three times if the reply can't be parsed.
// Network and quota errors are not retried.
async function askJSON(content){
  let lastErr;
  for(let attempt = 1; attempt <= 3; attempt++){
    try {
      return parseJSON(await ask(content));
    } catch(err){
      lastErr = err;
      if(!/JSON/.test(err.message)) throw err;
    }
  }
  throw lastErr;
}
const imageBlock = () => ({type:'image', source:{type:'base64', media_type:'image/jpeg', data:imageB64}});

// ---- Step 2: scan holds by colour ----
$('scanBtn').onclick = async () => {
  setError(''); $('scanBtn').disabled = true; setStatus('scanStatus','Scanning holds…');
  const hint = $('hint').value.trim().toLowerCase();
  const target = hint
    ? `This is a photo of an indoor bouldering wall. Find every hold of the colour "${hint}" and report only those. Do not include other colours.`
    : `This is a photo of an indoor bouldering wall. Identify each distinct route colour that has holds visible in the photo.`;
  const prompt = `${target}
For each colour, give approximate hold positions as fractions of the image: x (0 = left, 1 = right) and y (0 = top, 1 = bottom). Include every hold of that colour you can see. Mark start holds with "start": true.
If a colour is ambiguous, or the photo is too dark or blurred, say so in "notes".
Respond with ONLY JSON, no preamble, in this shape:
{"routes":[{"colour":"red","holds":[{"x":0.42,"y":0.77,"start":false}]}],"notes":""}`;
  try {
    const parsed = await askJSON([imageBlock(), {type:'text', text:prompt}]);
    routes = (parsed.routes||[]).filter(r => r.holds && r.holds.length);
    chosen = routes.length ? 0 : null;
    renderAll();
    setStatus('scanStatus', routes.length
      ? `Found ${routes.length} colour${routes.length>1?'s':''}. ${parsed.notes||''}`
      : `No routes found. ${parsed.notes||'Try a clearer, better-lit photo.'}`);
  } catch(err){
    setError('Scan failed: ' + err.message);
    setStatus('scanStatus','');
  } finally { $('scanBtn').disabled = false; }
};

// ---- Step 3: approach guide ----
function section(parent, title, body){
  const h = document.createElement('h3'); h.textContent = title; parent.appendChild(h);
  if(Array.isArray(body)){
    const list = document.createElement('ol');
    body.forEach(item => { const li=document.createElement('li'); li.textContent=item; list.appendChild(li); });
    parent.appendChild(list);
  } else {
    const p = document.createElement('p'); p.textContent = body || '—'; parent.appendChild(p);
  }
}
$('analyseBtn').onclick = async () => {
  if(chosen===null) return;
  const r = routes[chosen];
  setError(''); $('analyseBtn').disabled = true; $('guide').innerHTML=''; setStatus('status','Working out an approach…');
  const prompt = `The climber wants to attempt the ${r.colour} route shown in this photo.
Hold positions for that route, as fractions of the image (x left→right, y top→bottom, start holds flagged): ${JSON.stringify(r.holds)}
Give a practical, specific approach. Refer to holds by position or visual description. Use British English. Be concise. Note that the photo may not show the whole wall.
Respond with ONLY JSON, no preamble, in this shape:
{"estimated_grade":"","confidence":"low|medium|high","summary":"","start":"","sequence":["step 1","step 2"],"crux":"","footwork":["..."],"body_position":["..."],"alternatives":"","caveats":""}`;
  try {
    const g = await askJSON([imageBlock(), {type:'text', text:prompt}]);
    const out = $('guide');
    const top = document.createElement('p');
    const strong = document.createElement('strong'); strong.textContent = `${r.colour} route`;
    top.appendChild(strong);
    const badge = document.createElement('span'); badge.className='badge';
    badge.textContent = `${g.estimated_grade||'grade unknown'} · confidence ${g.confidence||'?'}`;
    top.appendChild(badge);
    out.appendChild(top);
    section(out,'Summary', g.summary);
    section(out,'Start', g.start);
    section(out,'Sequence', g.sequence||[]);
    section(out,'Crux', g.crux);
    section(out,'Footwork', g.footwork||[]);
    section(out,'Body position', g.body_position||[]);
    section(out,'Alternatives', g.alternatives);
    section(out,'Caveats', g.caveats);
    setStatus('status','');
  } catch(err){
    setError('Analysis failed: ' + err.message);
    setStatus('status','');
  } finally { $('analyseBtn').disabled = chosen===null; }
};
</script>
</body>
</html>
